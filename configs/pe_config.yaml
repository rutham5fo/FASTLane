Routing:
  - 'bridge'
  - 'split'
  - 'merge'

#--------------------- PE Description -----------------
# Customize by adding opGroups and Ops

PE_int:
  opGroup:
    alu:                                    # Opcodes supported by ALU
      - 'add'
      - 'sub'
      - 'mul'
      - 'div'
      - 'load'
      - 'store'
      - 'icmp'
    reg:
      - 'const'
      - 'acc'
    IO:
      - 'input'
      - 'output'

PE_float:
  opGroup:
    alu:
      - 'fadd'
      - 'fsub'
      - 'fmul'
      - 'fdiv'
      - 'sqrt'
      - 'load'
      - 'store'
    imm:
      - 'const'
    reg:
      - 'acc'
    IO:
      - 'input'
      - 'output'
