#-------------------------------------------------
# All PE/Functional-Unit specification goes here
#-------------------------------------------------

#--------------------- Node Attributes and Common Opcode categories -------------------

Attributes:
  - {name: 'immediate', translate: 'const'}
  - {name: 'direct_in', translate: 'input'}
  - {name: 'direct_out', translate: 'output'}
  - {name: 'reflexive', translate: 'acc'}

Routing:
  - 'bridge'
  - 'split'
  - 'merge'

#--------------------- PE Description -----------------
# Customize by adding opGroups and Ops

PE_int:                                     # PE type / name
  opGroup:
    alu:                                    # Opcodes supported by ALU
      - 'add'
      - 'sub'
      - 'mul'
      - 'div'
      - 'load'
      - 'store'
      - 'icmp'
      - 'not'
      - 'and'
      - 'or'
      - 'xor'
      - 'shl'
      - 'lshr'
      - 'ashr'
    reg:
      - 'const'
      - 'acc'
    IO:
      - 'input'
      - 'output'

PE_float:
  opGroup:
    alu:
      - 'fadd'
      - 'fsub'
      - 'fmul'
      - 'fdiv'
      - 'sqrt'
      - 'load'
      - 'store'
      - 'not'
      - 'and'
      - 'or'
      - 'xor'
      - 'shl'
      - 'lshr'
      - 'ashr'
    imm:
      - 'const'
    reg:
      - 'acc'
    IO:
      - 'input'
      - 'output'

