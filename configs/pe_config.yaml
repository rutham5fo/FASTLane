#--------------------- Node Attributes and Common Opcode categories -------------------

Attributes:
  - {name: 'immediate', translate: 'const'}
  - {name: 'direct_in', translate: 'input'}
  - {name: 'direct_out', translate: 'output'}
  - {name: 'reflexive', translate: 'acc'}

